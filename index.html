<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ㅋㅋㅋ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 16px;
      text-align: center;
    }

    #message {
      display: none;
      color: red;
      font-size: clamp(26px, 7vw, 42px);
      font-weight: 900;
      margin-bottom: 16px;
    }

    #photo {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="message">인 줄 알았지? ㅋ</div>
    <img id="photo" src="153F921D-E374-4661-9ED0-B840F08D2842.jpeg" alt="사진">
  </div>

  <script>
    setTimeout(() => {
      document.getElementById("message").style.display = "block";
      document.getElementById("photo").src = "photo-output.jpeg";
    }, 2000);
  </script>
</body>
</html>
