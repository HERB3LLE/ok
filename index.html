
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ㅋㅋㅋ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      font-family: sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 16px;
      text-align: center;
    }

    #message {
      display: none;
      color: red;
      font-size: clamp(26px, 7vw, 42px);
      font-weight: 900;
      margin-bottom: 16px;
    }

    #photo {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="message">인 줄 알았지? ㅋ</div>
    <img id="photo"
      src="153F921D-E374-4661-9ED0-B840F08D2842.jpeg"
      alt="사진">
  </div>

  <script>
    const firstPhoto =
      "153F921D-E374-4661-9ED0-B840F08D2842.jpeg";

    const secondPhoto = "photo-output.jpeg";

    const photo = document.getElementById("photo");
    const message = document.getElementById("message");

    // 두 번째 사진을 미리 불러오기
    const preload = new Image();
    preload.src = secondPhoto;

    function reveal() {
      // 사진과 글씨를 같은 순간에 변경
      photo.src = secondPhoto;
      message.style.display = "block";
    }

    // 2초 뒤 변경. 사진이 아직 로딩 중이면 로딩 완료 후 변경
    setTimeout(() => {
      if (preload.complete && preload.naturalWidth > 0) {
        reveal();
      } else {
        preload.onload = reveal;
      }
    }, 1250);
  </script>
</body>
</html>
