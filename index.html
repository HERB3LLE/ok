<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ㅋㅋㅋ</title>

  <!-- 두 번째 사진 미리 불러오기 -->
  <link
    rel="preload"
    as="image"
    href="photo-output.jpeg"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 16px;
      text-align: center;
    }

    #message {
      display: none;
      color: red;
      font-size: clamp(26px, 7vw, 42px);
      font-weight: 900;
      margin-bottom: 16px;
    }

    #photo {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="message">인 줄 알았쥐? ㅋ</div>

    <img
      id="photo"
      src="153F921D-E374-4661-9ED0-B840F08D2842.jpeg"
      alt="사진"
    >
  </div>

  <script>
    const photo = document.getElementById("photo");
    const message = document.getElementById("message");

    const secondPhoto = new Image();
    secondPhoto.src = "photo-output.jpeg";

    // 두 번째 사진을 미리 디코딩
    const ready = secondPhoto.decode().catch(() => {});

    // 페이지가 열린 뒤 1.5초 후 동시에 전환
    setTimeout(() => {
      photo.src = "photo-output.jpeg";
      message.style.display = "block";
    }, 1500);
  </script>
</body>
</html>
